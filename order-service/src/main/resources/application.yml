spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_order}
  jackson:
    default-property-inclusion: non_null
  kafka: # 👈 Merged under the single 'spring:' block
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
  security: # 👈 Merged under the single 'spring:' block
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}

server:
  port: 8085 # 👈 Merged under the single 'server:' block
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}

    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri=http://localhost:8081:

