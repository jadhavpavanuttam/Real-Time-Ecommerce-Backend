name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Build
        run: ./mvnw -B -DskipTests=false verify
      - name: Build images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for d in api-gateway auth-service user-service product-service cart-service order-service inventory-service payment-service notification-service; do
            ./mvnw -pl $d -am package -DskipTests
            docker build -t $d:${{ github.sha }} $d
          done
