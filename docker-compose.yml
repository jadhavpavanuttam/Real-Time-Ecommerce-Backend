services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
    ports: [ "27017:27017" ]
    volumes: [ mongo-data:/data/db, ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro ]
  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    ports: [ "6379:6379" ]
    command: [ "redis-server","--appendonly","yes" ]
    volumes: [ redis-data:/data ]
  kafka:
    image: bitnami/kafka:4.0
    restart: unless-stopped
    ports: [ "9092:9092" ]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  api-gateway:
    build: ./api-gateway
    depends_on: [ auth-service,user-service,product-service,cart-service,order-service,inventory-service,payment-service,notification-service ]
    ports: [ "8080:8080" ]
    environment: [ JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  auth-service:
    build: ./auth-service
    depends_on: [ mongo ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_auth?authSource=admin,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  user-service:
    build: ./user-service
    depends_on: [ mongo ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_user?authSource=admin,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  product-service:
    build: ./product-service
    depends_on: [ mongo ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_product?authSource=admin,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  cart-service:
    build: ./cart-service
    depends_on: [ mongo,redis ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_cart?authSource=admin,REDIS_HOST=redis,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  order-service:
    build: ./order-service
    depends_on: [ mongo,kafka ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_order?authSource=admin,KAFKA_BOOTSTRAP_SERVERS=kafka:9092,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  inventory-service:
    build: ./inventory-service
    depends_on: [ mongo,kafka ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_inventory?authSource=admin,KAFKA_BOOTSTRAP_SERVERS=kafka:9092,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  payment-service:
    build: ./payment-service
    depends_on: [ mongo,kafka ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_payment?authSource=admin,KAFKA_BOOTSTRAP_SERVERS=kafka:9092,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  notification-service:
    build: ./notification-service
    depends_on: [ mongo,kafka ]
    environment: [ MONGODB_URI=mongodb://root:${ MONGO_ROOT_PASSWORD:-change-me }@mongo:27017/ecommerce_notification?authSource=admin,KAFKA_BOOTSTRAP_SERVERS=kafka:9092,JWT_SECRET=${ JWT_SECRET:-change-me-in-production-please-use-a-256-bit-secret } ]
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    ports: [ "9090:9090" ]
    volumes: [ ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro ]
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    ports: [ "3000:3000" ]
    volumes: [ grafana-data:/var/lib/grafana ]
volumes: { mongo-data: { }, redis-data: { }, grafana-data: { } }
