spring:
  jackson:
    default-property-inclusion: non_null
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_cart}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
server:
  shutdown: graceful
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      productService:
        maxAttempts: 3
        waitDuration: 300ms
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
debug: true


