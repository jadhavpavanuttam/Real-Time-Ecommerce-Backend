spring:
  jackson:
    default-property-inclusion: non_null
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_auth}
server:
  shutdown: graceful
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
