spring:
  Jackson:
    default-property-inclusion: non_null
  kafka:
    #        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_notification}
server:
  shutdown: graceful
  port: 8088
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

#kafka:
#  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}

