server:
  port: 8080
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://auth-service:8081
              predicates: [ Path=/api/auth/** ]
            - id: users
              uri: http://user-service:8082
              predicates: [ Path=/api/users/** ]
            - id: products
              uri: http://product-service:8083
              predicates: [ Path=/api/products/** ]
            - id: cart
              uri: http://cart-service:8084
              predicates: [ Path=/api/cart/** ]
            - id: orders
              uri: http://order-service:8085
              predicates: [ Path=/api/orders/** ]
            - id: inventory
              uri: http://inventory-service:8086
              predicates: [ Path=/api/inventory/** ]
            - id: payments
              uri: http://payment-service:8087
              predicates: [ Path=/api/payments/** ]
            - id: notifications
              uri: http://notification-service:8088
              predicates: [ Path=/api/notifications/** ]
#debug: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
