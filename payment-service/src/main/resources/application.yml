spring:
  jackson:
    default-property-inclusion: non_null
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_payment}

    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri=http://localhost:8081:

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer: # 👈 Fixed: Aligned perfectly with bootstrap-servers
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer: # 👈 Fixed: Aligned perfectly with bootstrap-servers
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver: # 👈 Fixed: Repositioned step-indentation for security parsing
        jwt:
          secret-key: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}
server:
  shutdown: graceful
  port: 8087
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-256-bit-secret}


