global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['api-gateway:8080']}]
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081','user-service:8082','product-service:8083','cart-service:8084','order-service:8085','inventory-service:8086','payment-service:8087','notification-service:8088']
